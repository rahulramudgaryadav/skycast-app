<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SkyCast</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
 
:root {
  --primary: #6c63ff;
  --background: #f3f5ff;
  --card: rgba(255, 255, 255, 0.9);
  --text: #1d2340;
  --muted: #777d96;
  --border: #e4e7fb;
  --shadow: 0 20px 45px rgba(61, 64, 120, 0.12);
}
 
html, body { height: 100%; }
 
body {
  min-height: 100vh;
  font-family: "Poppins", sans-serif, system-ui;
  background: linear-gradient(135deg, #eef2ff, #f8f7ff);
  color: var(--text);
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
}
 
body.dark {
  --background: #101426; --card: rgba(28, 35, 58, 0.92); --text: #f5f7ff; --muted: #aeb5cb; --border: #2b3350;
  background: linear-gradient(135deg, #0f1428, #1b2140);
}
.input-group input, body.dark input { background: #fbfbff; }
body.dark .input-group input, body.dark #cityInput { background: #1c233a; color: #fff; }
 
.hidden { display: none !important; }
 
.background-circle { position: fixed; width: 400px; height: 400px; border-radius: 50%; filter: blur(100px); opacity: 0.25; z-index: -1; }
.circle-one { background: #7c3aed; top: -150px; left: -150px; }
.circle-two { background: #38bdf8; right: -150px; bottom: -150px; }
 
/* ---------- Login / Signup screen ---------- */
#loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
.login-card { width: 100%; max-width: 420px; background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 42px 38px; text-align: center; position: relative; overflow: hidden; }
.login-card::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #6c63ff, #8b5cf6, #38bdf8); }
.lock-icon { width: 60px; height: 60px; margin: 0 auto 14px; display: grid; place-items: center; background: linear-gradient(135deg, #8b5cf6, #6c63ff); border-radius: 16px; font-size: 28px; box-shadow: var(--shadow); }
.login-card h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
.login-card p.subtitle { color: var(--muted); font-size: 13px; margin-bottom: 28px; line-height: 1.5; }
.error-msg, .info-msg { font-size: 12px; padding: 10px 14px; border-radius: 10px; margin-bottom: 16px; display: none; }
.error-msg { background: #ffe2e2; color: #a00000; }
.info-msg { background: #e3f6e6; color: #1c6b2b; }
.error-msg.show, .info-msg.show { display: block; }
.input-group { margin-bottom: 16px; text-align: left; }
.input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.input-group input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--border); font-family: inherit; font-size: 14px; color: #ffffff; background: #2a2f4d; outline: none; transition: 0.2s; }
.input-group input::placeholder { color: #b7bde0; }
.input-group input:focus { border-color: var(--primary); }
.login-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; background: linear-gradient(135deg, #6c63ff, #8b5cf6); color: white; font-family: inherit; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 6px; box-shadow: 0 12px 25px rgba(108, 99, 255, 0.35); transition: 0.2s; }
.login-btn:hover { transform: translateY(-2px); box-shadow: 0 16px 30px rgba(108, 99, 255, 0.45); }
.login-btn:disabled { opacity: 0.65; cursor: not-allowed; transform: none; }
.signup-text { margin-top: 22px; font-size: 13px; color: var(--muted); }
.signup-text a { color: var(--primary); font-weight: 600; text-decoration: none; cursor: pointer; }
 
/* ---------- Dashboard / Weather app ---------- */
#dashboardScreen { display: none; }
.container { width: min(1000px, 92%); margin: auto; padding-bottom: 40px; }
 
.header { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; gap: 10px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 12px; }
.logo > span { width: 52px; height: 52px; display: grid; place-items: center; background: white; border-radius: 15px; font-size: 27px; box-shadow: var(--shadow); }
.logo h1 { font-size: 22px; font-weight: 700; }
.logo p { font-size: 12px; color: var(--muted); }
.header-actions { display: flex; gap: 10px; align-items: center; }
.icon-btn, .logout-btn { border: 1.5px solid var(--border); background: var(--card); color: var(--text); padding: 10px 14px; border-radius: 12px; font-family: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
.account-chip { font-size: 12px; color: var(--muted); margin-right: 4px; }
 
.search-bar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
.search-bar input { flex: 1; min-width: 180px; padding: 14px 16px; border-radius: 12px; border: 1.5px solid var(--border); font-family: inherit; font-size: 14px; color: var(--text); outline: none; }
.search-bar input:focus { border-color: var(--primary); }
.search-bar button { border: none; background: linear-gradient(135deg, #6c63ff, #8b5cf6); color: #fff; padding: 0 18px; border-radius: 12px; font-family: inherit; font-weight: 600; cursor: pointer; }
 
#loading, #errorBox { background: var(--card); border-radius: 16px; padding: 20px; text-align: center; box-shadow: var(--shadow); margin-bottom: 20px; font-size: 14px; }
#errorBox { color: #a00000; }
 
.current-card { background: var(--card); border-radius: 20px; padding: 30px; box-shadow: var(--shadow); margin-bottom: 20px; text-align: center; }
.current-card .city-name { font-size: 20px; font-weight: 700; }
.current-card .date { font-size: 12px; color: var(--muted); margin-bottom: 16px; }
.current-card .icon { font-size: 56px; }
.current-card .temp { font-size: 48px; font-weight: 700; }
.current-card .desc { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
 
.stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 20px; }
.stat-card { background: var(--card); border-radius: 14px; padding: 14px 8px; box-shadow: var(--shadow); text-align: center; }
.stat-card p { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.stat-card h4 { font-size: 15px; font-weight: 700; }
 
.panel { background: var(--card); border-radius: 20px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 20px; }
.panel h3 { font-size: 15px; margin-bottom: 16px; }
 
#forecastContainer { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.forecast-card { background: rgba(108,99,255,0.06); border-radius: 14px; padding: 14px 6px; text-align: center; }
.forecast-card .day { font-size: 12px; font-weight: 600; }
.forecast-card .date { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
.forecast-icon { font-size: 24px; margin-bottom: 4px; }
.forecast-temperature { font-size: 13px; font-weight: 600; }
.forecast-low { color: var(--muted); font-weight: 400; margin-left: 4px; }
.forecast-rain { font-size: 10px; color: var(--muted); margin-top: 4px; }
 
#weatherAdvice { font-size: 13px; line-height: 1.6; color: var(--text); }
 
@media (max-width: 700px) {
  .stats-grid { grid-template-columns: repeat(3, 1fr); }
  #forecastContainer { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
 
<div class="background-circle circle-one"></div>
<div class="background-circle circle-two"></div>
 
<!-- LOGIN / SIGNUP SCREEN -->
<div id="loginScreen">
  <div class="login-card">
    <div class="lock-icon">🔒</div>
    <h1 id="authTitle">Welcome Back</h1>
    <p class="subtitle" id="authSubtitle">Login to SkyCast to check live weather for your cities.</p>
    <div class="error-msg" id="loginError"></div>
    <div class="info-msg" id="loginInfo"></div>
    <form id="loginForm">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="authSubmitBtn">Log In</button>
    </form>
    <p class="signup-text" id="switchModeText">Don't have an account? <a id="switchModeLink">Sign up</a></p>
  </div>
</div>
 
<!-- DASHBOARD / LIVE WEATHER APP -->
<div id="dashboardScreen">
  <div class="container">
 
    <header class="header">
      <div class="logo">
        <span>🌤️</span>
        <div>
          <h1>SkyCast</h1>
          <p>Live weather, anywhere</p>
        </div>
      </div>
      <div class="header-actions">
        <span class="account-chip" id="accountChip"></span>
        <button class="icon-btn" id="locationBtn">📍</button>
        <button class="icon-btn" id="darkModeBtn">🌙</button>
        <button class="logout-btn" id="logoutBtn">Log Out</button>
      </div>
    </header>
 
    <div class="search-bar">
      <input type="text" id="cityInput" placeholder="Search a city...">
      <button id="searchBtn">Search</button>
    </div>
 
    <div id="loading" class="hidden">Loading weather...</div>
    <div id="errorBox" class="hidden"></div>
 
    <div id="weatherApp" class="hidden">
 
      <div class="current-card">
        <div class="city-name" id="cityName">—</div>
        <div class="date" id="date">—</div>
        <div class="icon" id="weatherIcon">🌤️</div>
        <div class="temp"><span id="temperature">--</span>°C</div>
        <div class="desc" id="weatherDescription">—</div>
        <div class="desc">Feels like <span id="feelsLike">--</span></div>
      </div>
 
      <div class="stats-grid">
        <div class="stat-card"><p>Humidity</p><h4 id="humidity">--</h4></div>
        <div class="stat-card"><p>Wind</p><h4 id="windSpeed">--</h4></div>
        <div class="stat-card"><p>Rain</p><h4 id="rainChance">--</h4></div>
        <div class="stat-card"><p>UV Index</p><h4 id="uvIndex">--</h4></div>
        <div class="stat-card"><p>Sunrise</p><h4 id="sunrise">--</h4></div>
        <div class="stat-card"><p>Sunset</p><h4 id="sunset">--</h4></div>
      </div>
 
      <div class="panel">
        <h3>5-Day Forecast</h3>
        <div id="forecastContainer"></div>
      </div>
 
      <div class="panel">
        <h3>Advice</h3>
        <div id="weatherAdvice">—</div>
      </div>
 
    </div>
  </div>
</div>
 
<script>
/* ============================================================
   AUTH — talks to our own backend (server.js), which is the
   only thing that touches the SQL database (skycast.db).
   Run the backend first (npm run start), then open this page
   through it: http://localhost:3000
   ============================================================ */
let currentUser = null; // { email, lastCity, theme }
let authMode = "login";
 
const loginForm = document.getElementById('loginForm');
const loginError = document.getElementById('loginError');
const loginInfo = document.getElementById('loginInfo');
const authTitle = document.getElementById('authTitle');
const authSubtitle = document.getElementById('authSubtitle');
const authSubmitBtn = document.getElementById('authSubmitBtn');
const switchModeText = document.getElementById('switchModeText');
 
function showAuthError(msg) { loginInfo.classList.remove('show'); loginError.textContent = msg; loginError.classList.add('show'); }
function clearAuthMessages() { loginError.classList.remove('show'); loginInfo.classList.remove('show'); }
 
function setAuthMode(mode) {
  authMode = mode;
  clearAuthMessages();
  if (mode === 'signup') {
    authTitle.textContent = 'Create Account';
    authSubtitle.textContent = 'Sign up to save your cities and preferences.';
    authSubmitBtn.textContent = 'Sign Up';
    switchModeText.innerHTML = 'Already have an account? <a id="switchModeLink">Log in</a>';
  } else {
    authTitle.textContent = 'Welcome Back';
    authSubtitle.textContent = 'Login to SkyCast to check live weather for your cities.';
    authSubmitBtn.textContent = 'Log In';
    switchModeText.innerHTML = "Don't have an account? <a id=\"switchModeLink\">Sign up</a>";
  }
  document.getElementById('switchModeLink').addEventListener('click', () => setAuthMode(authMode === 'login' ? 'signup' : 'login'));
}
setAuthMode('login');
 
loginForm.addEventListener('submit', async function(e) {
  e.preventDefault();
  clearAuthMessages();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
 
  if (!email || !password) { showAuthError('Please enter both email and password.'); return; }
 
  authSubmitBtn.disabled = true;
  authSubmitBtn.textContent = authMode === 'signup' ? 'Creating account…' : 'Logging in…';
 
  try {
    const endpoint = authMode === 'signup' ? '/api/signup' : '/api/login';
    const res = await fetch(endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) { showAuthError(data.error || 'Something went wrong.'); return; }
 
    currentUser = data; // { email, lastCity, theme }
    enterDashboard();
  } catch (err) {
    showAuthError('Could not reach the server. Is "npm run start" running?');
  } finally {
    authSubmitBtn.disabled = false;
    authSubmitBtn.textContent = authMode === 'signup' ? 'Sign Up' : 'Log In';
  }
});
 
function enterDashboard() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('dashboardScreen').style.display = 'block';
  document.getElementById('accountChip').textContent = currentUser.email;
  loginForm.reset();
  initWeatherApp(currentUser);
}
 
document.getElementById('logoutBtn').addEventListener('click', function() {
  currentUser = null;
  document.getElementById('dashboardScreen').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
  setAuthMode('login');
});
 
let saveTimer = null;
function savePrefs(patch) {
  if (!currentUser) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    fetch('/api/prefs', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: currentUser.email, ...patch })
    }).catch(err => console.warn('Could not save preference:', err));
  }, 400);
}
 
/* ---------- Live weather app (Open-Meteo) — unchanged ---------- */
let weatherInitialized = false;
 
function initWeatherApp(prefs) {
  prefs = prefs || { lastCity: 'Mumbai', theme: 'light' };
 
  const cityInput = document.getElementById("cityInput");
  const searchBtn = document.getElementById("searchBtn");
  const locationBtn = document.getElementById("locationBtn");
  const darkModeBtn = document.getElementById("darkModeBtn");
 
  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("errorBox");
  const weatherApp = document.getElementById("weatherApp");
 
  const weatherCodes = {
    0: ["Clear Sky", "☀️"], 1: ["Mainly Clear", "🌤️"], 2: ["Partly Cloudy", "⛅"], 3: ["Overcast", "☁️"],
    45: ["Fog", "🌫️"], 48: ["Fog", "🌫️"],
    51: ["Light Drizzle", "🌦️"], 53: ["Drizzle", "🌦️"], 55: ["Heavy Drizzle", "🌧️"],
    61: ["Light Rain", "🌦️"], 63: ["Moderate Rain", "🌧️"], 65: ["Heavy Rain", "🌧️"],
    71: ["Light Snow", "🌨️"], 73: ["Snow", "❄️"], 75: ["Heavy Snow", "❄️"],
    80: ["Rain Showers", "🌦️"], 81: ["Rain Showers", "🌧️"], 82: ["Heavy Showers", "⛈️"],
    95: ["Thunderstorm", "⛈️"], 96: ["Thunderstorm", "⛈️"], 99: ["Thunderstorm", "⛈️"]
  };
 
  function showLoading() {
    loading.classList.remove("hidden");
    weatherApp.classList.add("hidden");
    errorBox.classList.add("hidden");
  }
 
  function showError(message) {
    loading.classList.add("hidden");
    weatherApp.classList.add("hidden");
    errorBox.textContent = "⚠️ " + message;
    errorBox.classList.remove("hidden");
  }
 
  async function searchCity(presetCity) {
    const city = presetCity || cityInput.value.trim();
    if (!city) { showError("Please enter a city name."); return; }
    showLoading();
    try {
      const url = "https://geocoding-api.open-meteo.com/v1/search" +
        "?name=" + encodeURIComponent(city) + "&count=1&language=en&format=json";
      const response = await fetch(url);
      if (!response.ok) throw new Error("Unable to search for the city.");
      const data = await response.json();
      if (!data.results || data.results.length === 0) throw new Error("City not found. Try another city.");
      const location = data.results[0];
      loadWeather(location.latitude, location.longitude, location.name, location.country);
      savePrefs({ lastCity: location.name });
    } catch (error) {
      showError(error.message);
    }
  }
 
  async function loadWeather(latitude, longitude, city, country) {
    try {
      const url = "https://api.open-meteo.com/v1/forecast" +
        `?latitude=${latitude}&longitude=${longitude}` +
        "&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m" +
        "&hourly=precipitation_probability,uv_index" +
        "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset" +
        "&timezone=auto&forecast_days=5";
      const response = await fetch(url);
      if (!response.ok) throw new Error("Weather service is unavailable.");
      const data = await response.json();
      displayWeather(data, city, country);
    } catch (error) {
      showError(error.message);
    }
  }
 
  function displayWeather(data, city, country) {
    const current = data.current, daily = data.daily, hourly = data.hourly;
    const weather = weatherCodes[current.weather_code] || ["Unknown", "🌡️"];
 
    document.getElementById("cityName").textContent = country ? `${city}, ${country}` : city;
    document.getElementById("date").textContent = new Date(current.time).toLocaleDateString("en-IN", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
    document.getElementById("temperature").textContent = Math.round(current.temperature_2m);
    document.getElementById("feelsLike").textContent = Math.round(current.apparent_temperature) + "°C";
    document.getElementById("weatherIcon").textContent = weather[1];
    document.getElementById("weatherDescription").textContent = weather[0];
    document.getElementById("humidity").textContent = current.relative_humidity_2m + "%";
    document.getElementById("windSpeed").textContent = Math.round(current.wind_speed_10m) + " km/h";
 
    const index = findClosestHour(hourly.time);
    document.getElementById("rainChance").textContent = (hourly.precipitation_probability[index] || 0) + "%";
    document.getElementById("uvIndex").textContent = Number(hourly.uv_index[index] || 0).toFixed(1);
    document.getElementById("sunrise").textContent = formatTime(daily.sunrise[0]);
    document.getElementById("sunset").textContent = formatTime(daily.sunset[0]);
 
    createForecast(daily);
    createAdvice(current.temperature_2m, hourly.precipitation_probability[index] || 0, current.weather_code);
 
    loading.classList.add("hidden");
    errorBox.classList.add("hidden");
    weatherApp.classList.remove("hidden");
  }
 
  function findClosestHour(times) {
    const now = new Date();
    let closest = 0, difference = Infinity;
    times.forEach((time, index) => {
      const d = Math.abs(new Date(time) - now);
      if (d < difference) { difference = d; closest = index; }
    });
    return closest;
  }
 
  function formatTime(time) {
    return new Date(time).toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", hour12: true });
  }
 
  function createForecast(daily) {
    const container = document.getElementById("forecastContainer");
    container.innerHTML = "";
    for (let i = 0; i < daily.time.length; i++) {
      const date = new Date(daily.time[i] + "T12:00:00");
      const day = i === 0 ? "Today" : date.toLocaleDateString("en-IN", { weekday: "short" });
      const dateText = date.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
      const weather = weatherCodes[daily.weather_code[i]] || ["Unknown", "🌡️"];
      const card = document.createElement("div");
      card.className = "forecast-card";
      card.innerHTML = `
        <div class="day">${day}</div>
        <div class="date">${dateText}</div>
        <div class="forecast-icon">${weather[1]}</div>
        <div class="forecast-temperature">${Math.round(daily.temperature_2m_max[i])}°<span class="forecast-low">${Math.round(daily.temperature_2m_min[i])}°</span></div>
        <div class="forecast-rain">💧 ${daily.precipitation_probability_max[i] || 0}%</div>
      `;
      container.appendChild(card);
    }
  }
 
  function createAdvice(temperature, rain, weatherCode) {
    const advice = document.getElementById("weatherAdvice");
    if (rain >= 60) advice.textContent = "Rain is likely today. Carry an umbrella and avoid staying outdoors for long periods.";
    else if (weatherCode >= 95) advice.textContent = "Thunderstorms may occur. Stay indoors during lightning and avoid open areas.";
    else if (temperature >= 35) advice.textContent = "It is quite hot today. Drink plenty of water and avoid direct sunlight during peak hours.";
    else if (temperature <= 10) advice.textContent = "The temperature is low today. Wear warm clothes when going outside.";
    else advice.textContent = "The weather looks comfortable today. Enjoy your day and stay updated with the forecast.";
  }
 
  if (!weatherInitialized) {
    weatherInitialized = true;
    searchBtn.addEventListener("click", function() { searchCity(); });
    cityInput.addEventListener("keydown", function(event) { if (event.key === "Enter") searchCity(); });
 
    locationBtn.addEventListener("click", function() {
      if (!navigator.geolocation) { showError("Your browser does not support location."); return; }
      showLoading();
      navigator.geolocation.getCurrentPosition(
        function(position) { loadWeather(position.coords.latitude, position.coords.longitude, "My Location", ""); },
        function() { showError("Location permission was denied."); }
      );
    });
 
    darkModeBtn.addEventListener("click", function() {
      document.body.classList.toggle("dark");
      const dark = document.body.classList.contains("dark");
      darkModeBtn.textContent = dark ? "☀️" : "🌙";
      savePrefs({ theme: dark ? "dark" : "light" });
    });
  }
 
  if (prefs.theme === "dark") {
    document.body.classList.add("dark");
    darkModeBtn.textContent = "☀️";
  } else {
    document.body.classList.remove("dark");
    darkModeBtn.textContent = "🌙";
  }
 
  searchCity(prefs.lastCity || "Mumbai");
}
</script>
 
</body>
</html>
